<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>
        {% block title %}{{ public_settings.get('restaurant_name', 'Restaurant POS') }}{% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Enhanced Login Styles - Only for Login Page -->
    {% if request.endpoint == 'auth.login' %}
    <link
      href="{{ url_for('static', filename='css/modern-login-enhanced.css') }}"
      rel="stylesheet"
    />
    {% endif %}

    {% block extra_css %}{% endblock %}

    <style>
        /* Reset for auth pages */
        body.auth-page {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Inter', 'Poppins', sans-serif;
            background: #ffffff;
        }

        /* Ensure no interference from global styles */
        body.auth-page * {
            box-sizing: border-box;
        }
    </style>
</head>
<body class="auth-page">
    <!-- Page Content -->
    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
