{% extends "base.html" %}

{% block title %}Server Error - {{ settings.restaurant_name or 'Restaurant POS' }}{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="error-page">
                <h1 class="display-1 text-danger">500</h1>
                <h2 class="h3 text-muted mb-3">Internal Server Error</h2>
                <p class="text-muted mb-4">
                    Something went wrong on our end. Our team has been notified and is working to fix the issue.
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i>Go to Dashboard
                    </a>
                    <button onclick="location.reload()" class="btn btn-outline-secondary">
                        <i class="fas fa-sync me-2"></i>Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    padding: 2rem;
}
.error-page .display-1 {
    font-size: 6rem;
    font-weight: 300;
    line-height: 1;
}
</style>
{% endblock %}
