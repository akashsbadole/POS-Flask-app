{% extends "base.html" %} 
{% block title %}Kitchen Display - Restaurant POS{% endblock %} 
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/kot-modern.css') }}">
<style>
  /* Additional overrides for this specific template */
  .kot-display {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  }
  
  .order-card {
    margin-bottom: var(--kot-spacing-lg);
  }
  
  .time-display {
    display: flex;
    align-items: center;
    gap: var(--kot-spacing-sm);
    font-weight: 600;
  }
  
  .countdown-timer {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 16px;
  }
</style>
{% endblock %} 

{% block content %}
<div class="container-fluid kot-display" x-data="kotDisplay()">
  <!-- Header -->
  <div class="kot-header">
    <h1 class="kot-title">
      <i class="fas fa-utensils"></i>
      Kitchen Display System
    </h1>
    <div class="kot-controls">
      <button @click="toggleAutoRefresh()" :class="{active: autoRefresh}" class="control-btn">
        <i class="fas fa-sync-alt" :class="{ 'fa-spin': autoRefresh }"></i> 
        Auto Refresh
      </button>
      <button @click="toggleSound()" :class="{active: soundEnabled}" class="control-btn">
        <i class="fas fa-volume-up"></i> 
        Sound
      </button>
      <button @click="refreshOrders()" class="control-btn">
        <i class="fas fa-sync"></i> 
        Refresh Now
      </button>
      <button @click="openBulkActions()" class="control-btn">
        <i class="fas fa-tasks"></i> 
        Bulk Actions
      </button>
      <button @click="printAllPending()" class="control-btn">
        <i class="fas fa-print"></i> 
        Print All
      </button>
    </div>
  </div>

  <!-- Filter Controls -->
  <div class="kot-controls" style="padding: 0 var(--kot-spacing-lg); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);">
    <button @click="filterStatus = 'all'" :class="{active: filterStatus === 'all'}" class="filter-btn">
      All Orders
    </button>
    <button @click="filterStatus = 'new'" :class="{active: filterStatus === 'new'}" class="filter-btn">
      New
    </button>
    <button @click="filterStatus = 'progress'" :class="{active: filterStatus === 'progress'}" class="filter-btn">
      In Progress
    </button>
    <button @click="filterStatus = 'ready'" :class="{active: filterStatus === 'ready'}" class="filter-btn">
      Ready
    </button>
  </div>

  <!-- Main Content -->
  <div class="kot-content">
    <!-- New Orders Column -->
    <div class="orders-column new-orders" x-show="filterStatus === 'all' || filterStatus === 'new'">
      <div class="column-header">
        <i class="fas fa-clock"></i>
        New Orders
        <span class="badge bg-danger" x-text="getOrderCount('new')"></span>
      </div>
      
      <template x-for="order in getFilteredOrders('new')" :key="order.id">
        <div class="order-card" 
             :class="getTimeBasedClass(order)"
             @click="selectOrder(order)">
          <div class="order-header">
            <span class="order-number" x-text="`Order #${order.order_number}`"></span>
            <span class="order-time" x-text="formatTime(order.created_at)"></span>
          </div>
          
          <div class="order-meta">
            <span class="table-info" x-show="order.table_number" x-text="`Table ${order.table_number}`"></span>
            <span class="urgency-badge" 
                  :class="`urgency-${getUrgencyLevel(order)}`" 
                  x-text="getUrgencyLevel(order).toUpperCase()"></span>
          </div>
          
          <div class="time-display">
            <i class="fas fa-hourglass-half"></i>
            <span>Age: </span>
            <span class="countdown-timer" x-text="getOrderAge(order)"></span>
            <span class="time-indicator" :class="getTimeIndicatorClass(order)" x-text="getTimeStatus(order)"></span>
          </div>
          
          <div class="order-items">
            <template x-for="item in order.items" :key="item.id">
              <div class="item-row">
                <span class="item-name" x-text="item.item_name"></span>
                <div>
                  <span class="item-quantity" x-text="item.quantity"></span>
                  <span class="item-status" 
                        :class="`status-${item.status.toLowerCase().replace(' ', '-')}`"
                        @click.stop="updateItemStatus(item.id, getNextStatus(item.status))"
                        x-text="item.status"></span>
                </div>
              </div>
            </template>
          </div>
          
          <div class="special-instructions" x-show="hasSpecialInstructions(order)" x-text="getSpecialInstructions(order)"></div>
          
          <div class="order-actions">
            <button @click.stop="startOrder(order.id)" class="action-btn start-btn">
              <i class="fas fa-play"></i> 
              Start
            </button>
            <button @click.stop="printKOT(order.id)" class="action-btn print-btn">
              <i class="fas fa-print"></i> 
              Print
            </button>
          </div>
        </div>
      </template>
      
      <div class="empty-state" x-show="getFilteredOrders('new').length === 0">
        <i class="fas fa-clock"></i>
        <p>No new orders</p>
      </div>
    </div>

    <!-- In Progress Orders Column -->
    <div class="orders-column progress-orders" x-show="filterStatus === 'all' || filterStatus === 'progress'">
      <div class="column-header">
        <i class="fas fa-fire"></i>
        In Progress
        <span class="badge bg-warning" x-text="getOrderCount('progress')"></span>
      </div>
      
      <template x-for="order in getFilteredOrders('progress')" :key="order.id">
        <div class="order-card" 
             :class="getTimeBasedClass(order)"
             @click="selectOrder(order)">
          <div class="order-header">
            <span class="order-number" x-text="`Order #${order.order_number}`"></span>
            <span class="order-time" x-text="formatTime(order.created_at)"></span>
          </div>
          
          <div class="order-meta">
            <span class="table-info" x-show="order.table_number" x-text="`Table ${order.table_number}`"></span>
            <span class="urgency-badge" 
                  :class="`urgency-${getUrgencyLevel(order)}`" 
                  x-text="getUrgencyLevel(order).toUpperCase()"></span>
          </div>
          
          <div class="time-display">
            <i class="fas fa-hourglass-half"></i>
            <span>Age: </span>
            <span class="countdown-timer" x-text="getOrderAge(order)"></span>
            <span class="time-indicator" :class="getTimeIndicatorClass(order)" x-text="getTimeStatus(order)"></span>
          </div>
          
          <div class="order-items">
            <template x-for="item in order.items" :key="item.id">
              <div class="item-row">
                <span class="item-name" x-text="item.item_name"></span>
                <div>
                  <span class="item-quantity" x-text="item.quantity"></span>
                  <span class="item-status" 
                        :class="`status-${item.status.toLowerCase().replace(' ', '-')}`"
                        @click.stop="updateItemStatus(item.id, getNextStatus(item.status))"
                        x-text="item.status"></span>
                </div>
              </div>
            </template>
          </div>
          
          <div class="special-instructions" x-show="hasSpecialInstructions(order)" x-text="getSpecialInstructions(order)"></div>
          
          <div class="order-actions">
            <button @click.stop="markReady(order.id)" class="action-btn ready-btn">
              <i class="fas fa-check"></i> 
              Ready
            </button>
            <button @click.stop="printKOT(order.id)" class="action-btn print-btn">
              <i class="fas fa-print"></i> 
              Print
            </button>
          </div>
        </div>
      </template>
      
      <div class="empty-state" x-show="getFilteredOrders('progress').length === 0">
        <i class="fas fa-utensils"></i>
        <p>No orders in progress</p>
      </div>
    </div>

    <!-- Ready Orders Column -->
    <div class="orders-column ready-orders" x-show="filterStatus === 'all' || filterStatus === 'ready'">
      <div class="column-header">
        <i class="fas fa-check-circle"></i>
        Ready for Pickup
        <span class="badge bg-success" x-text="getOrderCount('ready')"></span>
      </div>
      
      <template x-for="order in getFilteredOrders('ready')" :key="order.id">
        <div class="order-card" 
             :class="getTimeBasedClass(order)"
             @click="selectOrder(order)">
          <div class="order-header">
            <span class="order-number" x-text="`Order #${order.order_number}`"></span>
            <span class="order-time" x-text="formatTime(order.created_at)"></span>
          </div>
          
          <div class="order-meta">
            <span class="table-info" x-show="order.table_number" x-text="`Table ${order.table_number}`"></span>
            <span class="urgency-badge" 
                  :class="`urgency-${getUrgencyLevel(order)}`" 
                  x-text="getUrgencyLevel(order).toUpperCase()"></span>
          </div>
          
          <div class="time-display">
            <i class="fas fa-hourglass-half"></i>
            <span>Age: </span>
            <span class="countdown-timer" x-text="getOrderAge(order)"></span>
            <span class="time-indicator" :class="getTimeIndicatorClass(order)" x-text="getTimeStatus(order)"></span>
          </div>
          
          <div class="order-items">
            <template x-for="item in order.items" :key="item.id">
              <div class="item-row">
                <span class="item-name" x-text="item.item_name"></span>
                <div>
                  <span class="item-quantity" x-text="item.quantity"></span>
                  <span class="item-status" 
                        :class="`status-${item.status.toLowerCase().replace(' ', '-')}`"
                        @click.stop="updateItemStatus(item.id, getNextStatus(item.status))"
                        x-text="item.status"></span>
                </div>
              </div>
            </template>
          </div>
          
          <div class="special-instructions" x-show="hasSpecialInstructions(order)" x-text="getSpecialInstructions(order)"></div>
          
          <div class="order-actions">
            <button @click.stop="completeOrder(order.id)" class="action-btn complete-btn">
              <i class="fas fa-check-double"></i> 
              Complete
            </button>
            <button @click.stop="printKOT(order.id)" class="action-btn print-btn">
              <i class="fas fa-print"></i> 
              Print
            </button>
          </div>
        </div>
      </template>
      
      <div class="empty-state" x-show="getFilteredOrders('ready').length === 0">
        <i class="fas fa-check-circle"></i>
        <p>No ready orders</p>
      </div>
    </div>
  </div>

  <!-- Bulk Actions Panel -->
  <div class="bulk-actions" x-show="showBulkActions" x-transition>
    <h5>Bulk Actions</h5>
    <div class="bulk-select">
      <label>
        <input type="checkbox" @change="toggleSelectAll" :checked="allSelected">
        Select All Visible
      </label>
    </div>
    <div class="d-flex gap-2">
      <button @click="bulkUpdateStatus('In Progress')" class="btn btn-warning btn-sm">
        Start All
      </button>
      <button @click="bulkUpdateStatus('Ready')" class="btn btn-success btn-sm">
        Mark All Ready
      </button>
      <button @click="bulkUpdateStatus('Completed')" class="btn btn-primary btn-sm">
        Complete All
      </button>
      <button @click="closeBulkActions()" class="btn btn-secondary btn-sm">
        Close
      </button>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="notificationContainer"></div>

  <!-- Audio for notifications -->
  <audio id="notificationSound" preload="auto">
    <source src="{{ url_for('static', filename='sounds/notification.mp3') }}" type="audio/mpeg" />
  </audio>
  
  <audio id="urgentSound" preload="auto">
    <source src="{{ url_for('static', filename='sounds/urgent.mp3') }}" type="audio/mpeg" />
  </audio>
</div>

<script>
  // Pass data from Flask to JavaScript
  window.activeOrders = {{ active_orders|tojson|safe }};
  window.activeOrdersCount = {{ active_orders|length }};
</script>
<script src="{{ url_for('static', filename='js/kot-enhanced.js') }}"></script>
{% endblock %}
